[workspace]
resolver = "2"
# 2026-07-01 consolidation (ADR-0012): workspace = protocol + UHID core + AI middleware.
# `android-hid-{daemon,agent,cli,py}` removed — superseded by `ai-device-kernel` (the
# `adk` binary). See CHANGELOG.md for Removed entries.
members = [
    ".",
    "android-hid-protocol",
    "ai-device-kernel",
]

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/android-hid-connect"

[workspace.dependencies]
thiserror = "2"
bytes = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
criterion = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
blake3 = { version = "1", default-features = false }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
schemars = { version = "1.2", default-features = false, features = ["derive"] }
jsonschema = { version = "0.46", default-features = false }
semver = { version = "1", default-features = false, features = ["serde"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release profile shared by every member. The `adk` binary benefits most from
# `opt-level = "z"` + LTO + strip (smallest on-device footprint); the root lib
# crate is unaffected because it has no release-specific binaries.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

# ---------------------------------------------------------------------------
# Byte-exact scrcpy UHID control surface — the lowest layer that
# `ai-device-kernel`'s `bridge` module calls to drive real Android input.
# This file is both the workspace root AND a workspace member.
# ---------------------------------------------------------------------------

[package]
name = "android-hid-connect"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "AI middleware for controlling Android devices — byte-exact scrcpy UHID core (this crate) + on-device AI Device Kernel (sibling crate). One binary (`adk`), one port (9008), one protocol (postcard/4-verb)."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["android", "ai", "agent", "uhid", "automation"]
categories = ["api-bindings", "hardware-support", "development-tools::cargo-plugins"]

[lib]
name = "android_hid_connect"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
bytes = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "uhid_throughput"
harness = false

[features]
default = []
std = []
tokio = ["dep:tokio"]

[lints]
workspace = true