[package]
name = "ai-device-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-device AI Device Kernel — single AI middleware for controlling Android. One binary (`adk`), one port (9008), one protocol (postcard/4-verb). LLM Intent → typed Action → UHID bytes. See ADR-0012."

[lib]
name = "ai_device_kernel"
path = "src/lib.rs"

[dependencies]
android-hid-protocol = { path = "../android-hid-protocol" }
android-hid-connect = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true, optional = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
semver = { workspace = true }

[features]
sqlite = ["dep:rusqlite"]
# sqlite is on by default for the AI Device Kernel daemon
# (AC-V3-3.6). Disable for resource-constrained builds.
default = ["sqlite"]

[[bin]]
name = "adk"
path = "src/bin/adk.rs"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
